# Host-clean OpenViking stack for the okf-viking bridge.
# Nothing installs on the host — OpenViking + its embedding model run in containers.
#
#   1. cp deploy/ov.conf.example deploy/ov.conf   # then fill in your VLM proxy + a root key
#   2. docker compose -f deploy/docker-compose.yml up -d
#   3. docker exec ov-ollama ollama pull nomic-embed-text
#   4. wait for health, mint a user key, then run `okf-viking ...` (see docs/quickstart.md)
#
# The bridge itself also runs in a container (deploy/Dockerfile.dev) — never pip-install
# on the host. OpenViking is AGPL-3.0; the bridge only talks to it over HTTP.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ov-ollama
    volumes:
      - ollama_models:/root/.ollama

  openviking:
    image: ghcr.io/volcengine/openviking:latest
    container_name: openviking
    depends_on: [ollama]
    ports:
      - "1933:1933"
    # restart: unless-stopped
    volumes:
      # - .:/app/.openviking
      - ./ov.conf:/app/.openviking/ov.conf:ro
      - ./data:/app/.openviking/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1933/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  ollama_models:
